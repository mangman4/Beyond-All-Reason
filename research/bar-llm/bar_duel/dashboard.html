<!doctype html><meta charset="utf-8"><title>BAR · LLM 비교</title>
<style>body{background:#101820;color:#e7edf4;font:17px system-ui;margin:30px}h1{font-size:28px}main{display:grid;grid-template-columns:1fr 1fr;gap:24px}section{background:#1d2c3b;border-radius:16px;padding:24px}section:first-child{border-top:4px solid #35ddb6}section:last-child{border-top:4px solid #ed8d9c}article{border-top:1px solid #415369;padding:14px 0}small{color:#aab8c6}.error{color:#ffaaaa}pre{white-space:pre-wrap;font:inherit}table{width:100%;font-size:15px;border-collapse:collapse}td{padding:8px;border-bottom:1px solid #415369}.collaboration{background:#162332;padding:14px;border-radius:10px}summary{cursor:pointer;margin-bottom:12px}details{margin-bottom:12px}@media(max-width:800px){main{grid-template-columns:1fr}body{margin:16px}} </style>
<h1>BAR · Cloud GLM vs Local Qwen</h1><p id="status">연결 중</p><p>관전자 화면과 별도로 표시되는 모델 판단 기록 · 판단 중에도 경기는 계속 진행됩니다. 명령 접수는 건설·생산 완료와 다릅니다.</p><main id="agents"></main>
<style>.speedbar{background:#1d2c3b;padding:16px;border-radius:12px;margin:18px 0}.speedbar button{font:inherit;color:#e7edf4;background:#263e52;border:1px solid #668098;border-radius:8px;padding:9px 20px;margin-right:8px;cursor:pointer}.speedbar button[aria-pressed=true]{background:#176b59;border-color:#35ddb6}.speedbar button:disabled{opacity:.5;cursor:wait}#speedinfo{display:inline-block;margin:8px}#speederror{color:#ffaaaa}</style>
<div class="speedbar" id="speedbar" aria-label="게임 배속"><b>게임 배속</b><p><button data-speed="1" disabled aria-pressed="false">1배</button><button data-speed="2" disabled aria-pressed="false">2배</button><button data-speed="4" disabled aria-pressed="false">4배</button><span id="speedinfo" role="status">게임 연결 대기</span></p><p id="speederror" role="alert"></p><small>게임 배속만 변경됩니다. AI 응답 시간은 그대로이며, 배속 변경은 실험 기록에 저장됩니다.</small></div>
<script>
document.querySelector('#agents').before(document.querySelector('#speedbar'));
let speedBusy=false;
const speedButtons=[...document.querySelectorAll('[data-speed]')];
speedButtons.forEach(button=>button.addEventListener('click',async()=>{
  speedBusy=true;speedButtons.forEach(b=>b.disabled=true);document.querySelector('#speederror').textContent='';
  try{const response=await fetch('/speed',{method:'POST',headers:{'Content-Type':'application/json','X-Speed-Token':'__SPEED_TOKEN__'},body:JSON.stringify({speed:Number(button.dataset.speed)})});const result=await response.json();if(!response.ok)throw new Error(result.error||'배속 변경 실패');}
  catch(error){document.querySelector('#speederror').textContent=error.message;}
  finally{speedBusy=false;update();}
}));
function showSpeed(s){const v=s.speed||{};speedButtons.forEach(b=>{b.disabled=speedBusy||v.pending||s.status!=='running';b.setAttribute('aria-pressed',String(Number(b.dataset.speed)===v.requested));});document.querySelector('#speedinfo').textContent=(v.pending?'배속 적용 확인 중 · ':'')+(v.paused?'일시 정지 · ':'')+'설정 '+(v.requested??'—')+'배 / 실제 '+(v.actual==null?'—':Number(v.actual).toFixed(2))+'배';if(v.error)document.querySelector('#speederror').textContent=v.error;}
const labels={invalid_orders:'명령 묶음 형식 오류',invalid_role:'담당 역할 불일치',invalid_units:'유닛 목록 오류',invalid_target:'대상이 사라짐',target_not_owned:'아군 대상이 아님',target_not_visible_feature:'잔해가 보이지 않음',invalid_build_type:'건설 종류 오류',invalid_role_or_facing:'역할·건설 방향 오류',invalid_count:'생산 수량 오류',invalid_command:'지원하지 않는 명령',duplicate_unit:'유닛 중복 지정',unit_unfinished:'미완성 유닛',unit_cannot_move:'이동 불가 유닛',unit_cannot_attack:'공격 불가 유닛',unit_cannot_build:'건설 불가 유닛',unit_not_factory:'공장이 아님',type_not_buildable:'생산 목록에 없는 종류',rejected:'명령 거부',direct_economy:'경제 직접 명령',direct_production:'생산 직접 명령',direct_combat:'전투 직접 명령',partial:'일부 명령만 접수',blocked_build_site:'건설 위치 부적합',unit_not_owned:'유닛 소유권 불일치',target_not_visible_enemy:'현재 보이는 적이 아님',out_of_bounds:'맵 범위 초과',move:'이동',fight:'교전 이동',build:'건설',produce:'생산',stop:'중지',economy:'경제 담당',production:'생산 담당',combat:'전투 담당',coordinator:'최종 조정',ok:'제안 완료',no_available_action:'가능 행동 없음 · 호출 생략',budget_exhausted:'군집 시간 한도 초과',cancelled:'종료로 취소',agreement:'유효한 제안 일치',sole_valid_proposal:'유효한 제안 하나',llm_arbitration:'모델이 제안 중 최종 선택',arbitration_failed:'최종 조정 실패',no_valid_proposals:'유효한 제안 없음',starting:'게임 준비 중',running:'경기 진행 중',thinking:'판단 중',waiting:'다음 판단 대기',disabled:'연속 오류로 중지',finished:'경기 종료',time_limit:'시간 제한 종료',accepted:'명령 접수',applied:'명령 접수',sent:'명령 전달 중',wait:'기존 명령 유지',unavailable:'상황 변경으로 취소',stale:'오래된 판단 취소',error:'오류',timeout:'응답 시간 초과',ack_timeout:'명령 확인 실패','executing existing orders':'진행 중인 작업 수행',build_energy:'발전소 건설',build_factory:'공장 건설',build_defense:'방어 시설 건설',build_radar:'레이더 건설',expand_metal:'금속 채굴 확장',produce_tank:'전차 생산',produce_scout:'정찰 차량 생산',produce_constructor:'건설 차량 생산',attack:'공격',retreat:'후퇴',scout_center:'중앙 정찰'};const label=v=>labels[v]||({repair:'수리',reclaim:'잔해 회수',investigate:'이전 목격 지역 확인',attack:'관측한 적 공격',scout:'측면 정찰',defend:'거점 방어',withdraw:'부상 병력 후퇴'}[String(v).split('_')[0]])||v;
const esc=v=>String(typeof v==='number'&&!Number.isInteger(v)?Math.round(v*1000)/1000:v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function orderText(orders){return (orders||[]).map(o=>label(o.command)+' · 유닛 '+o.units.join(', ')+(o.x!=null?' → ('+o.x+', '+o.z+')':'')+(o.target!=null?' → 대상 '+o.target:'')+(o.unit_type?' · '+o.unit_type:'')+(o.count?' × '+o.count:'')).join(' / ')}
function stepRows(steps){return Object.values(steps).map(p=>`<tr><td>${esc(label(p.role))}</td><td>${esc(p.choice?label(p.choice.action_id):label(p.status))}<br><small>${esc(orderText(p.choice?.orders))}</small></td><td>${p.role_latency==null?'—':esc(p.role_latency)+'초'}</td></tr>`).join('')}
function collaboration(a){if(!a.collaboration)return '';let c=a.collaboration;return `<div class="collaboration"><h3>역할별 협업 · 관측 ${esc(c.frame)}</h3><p><small>경제 → 생산 → 전투 → 필요 시 최종 조정<br>같은 로컬 모델을 순차 호출합니다.</small></p><table>${stepRows(c.steps)}</table></div>`}
function history(h,team,openKeys){return `<article><b>#${h.request} · ${esc(label(h.action))} · ${esc(label(h.status))} · ${h.latency}초</b><p>${h.reason?"모델 이유: ":""}${esc(h.reason||h.error)}</p>${h.orders?.length?`<p>${esc(orderText(h.orders))}</p>`:''}${h.order_result?`<small>명령 접수 ${esc(h.order_result.accepted)} / ${esc(h.order_result.total)}</small>`:''}${h.swarm?`<p>${esc(label(h.swarm.selection))} · 모델 호출 ${h.swarm.model_calls}회 · 역할 오류 ${h.swarm.role_errors}회</p><details data-key="${team}-${h.request}" ${openKeys.has(team+"-"+h.request)?"open":""}><summary>담당별 제안 보기</summary><table>${stepRows(h.swarm.steps)}</table><p>채택 제안: ${esc(h.swarm.selected_roles.map(label).join(', ')||'대기')}</p></details>`:''}<small>입력 ${esc(h.input_tokens)} / 출력 ${esc(h.output_tokens)} 토큰 · 관측 ${h.frame} → 적용 ${esc(h.applied_frame)}</small></article>`}
async function update(){try{
let s=await(await fetch('/state')).json();let openKeys=new Set([...document.querySelectorAll('details[open]')].map(d=>d.dataset.key));
showSpeed(s);
document.querySelector('h1').textContent='BAR · Cloud 단일 vs Local '+(s.local_mode==='swarm'?'역할 군집':'단일');
document.querySelector('#status').textContent=(s.dry_run?'연결 검증용 자동 행동 · LLM 비교 아님 | ':'')+label(s.status)+(s.control==='direct'?' | 직접 제어 · 유닛·좌표·생산 수량을 모델이 지정':s.control==='assisted'?' | 안정형 · AI가 행동 선택 / 엔진이 유닛·위치 지정':' | 기존 전략 선택');
document.querySelector('#agents').innerHTML=s.agents.map((a,i)=>`<section><h2>${i?'Local':'Cloud'} · ${esc(a.model)}</h2><p>${esc(label(a.status))} · 프레임 ${esc(a.observation?.frame)}</p><p>금속 ${esc(a.observation?.resources.metal)} · 에너지 ${esc(a.observation?.resources.energy)} · 전투 유닛 ${esc(a.observation?.army)}</p><p>병력 체력 ${esc(a.observation?.force?.health_percent)}% · 유휴 병력 ${esc(a.observation?.force?.idle)} · 기지 주변 적 ${esc(a.observation?.threat?.base_visible_enemies)}</p><p>금속 수지 ${esc(a.observation?.resources?.metal_net)} / 에너지 수지 ${esc(a.observation?.resources?.energy_net)} · 진행 작업 ${esc(a.observation?.jobs?.length)}</p><p>판단 주기 ${a.decisions||0}회 · 실제 호출 ${a.model_calls||0}회 · 주기 오류 ${a.errors||0}회${i&&s.local_mode==='swarm'?' · 역할 호출 오류 '+(a.role_errors||0)+'회':''}</p><p>확인된 토큰 ${(a.input_tokens||0)+(a.output_tokens||0)} · 평균 판단 주기 ${a.decisions?(a.latency_sum/a.decisions).toFixed(1):0}초</p>${collaboration(a)}${a.history.map(h=>history(h,i,openKeys)).join('')}</section>`).join('');
}catch{speedButtons.forEach(b=>b.disabled=true);document.querySelector('#speedinfo').textContent='연결 종료';document.querySelector('#status').textContent='서버 연결 종료 — 경기 기록은 runs 폴더에 저장됩니다.'}}
setInterval(update,1000);update();
</script>
